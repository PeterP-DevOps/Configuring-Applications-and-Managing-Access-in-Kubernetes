
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: web-app-ingress
  namespace: default

spec:
  ingressClassName: public

  # Настройка HTTPS
  tls:
    - hosts:
        - myapp.example.com
      secretName: tls-secret

  # Правило маршрутизации запросов
  rules:
    - host: myapp.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-app
                port:
                  number: 80
